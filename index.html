<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YonBIP 用友商业创新平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: url("picture/001.jpg") no-repeat center center;
            background-size: cover;
        }
        .container{
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-start;
            padding: 120px 60px 0 80px;
        }
        .left-text{
            flex: 1;
            padding-top: 40px;
        }
        .title-red{
            font-size: 64px;
            color:#e6212a;
            font-weight: bold;
            margin-bottom:12px;
        }
        .title-gray{
            font-size: 48px;
            color:#666666;
        }
        .login-card{
            width: 540px;
            background-color: #ffffff;
            border-radius:16px;
            padding:28px 32px;
        }
        .card-header{
            display:flex;
            justify-content: space-between;
            align-items:center;
            margin-bottom:24px;
        }
        .logo-title{
            font-size:24px;
            font-weight:bold;
            color:#e6212a;
        }
        .lang-select{
            font-size:14px;
            color:#444;
        }
        .tab-bar{
            display:flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom:24px;
            border-bottom: 1px solid #eee;
        }
        .tab-left-wrap{
            display:flex;
            gap:32px;
        }
        .tab-item{
            font-size:16px;
            padding-bottom:8px;
            cursor: pointer;
            color:#999;
        }
        .tab-item.active{
            font-weight:bold;
            color:#222;
            border-bottom: 2px solid #e6212a;
        }
        .corner-icon{
            width: 44px;
            height: 44px;
            cursor: pointer;
        }
        .page{
            display: none;
            /*关键：固定最小高度，卡片不会缩放跳动*/
            min-height: 360px;
        }
        .page.show{
            display:block;
        }
        .input-item{
            margin-bottom: 18px;
        }
        .input-item input{
            width: 100%;
            height: 44px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0 14px;
            font-size: 15px;
        }
        .phone-row{
            display:flex;
            gap:12px;
        }
        .phone-area{
            width: 120px;
            line-height:44px;
            font-size:18px;
            white-space: nowrap;
        }
        .code-row{
            display:flex;
            gap:12px;
        }
        .get-code-btn{
            width: 180px;
            height: 44px;
            background:#555b68;
            color:white;
            border:none;
            border-radius:4px;
            font-size:16px;
            cursor: pointer;
        }
        .row-opt{
            display:flex;
            justify-content: space-between;
            align-items:center;
            margin-bottom:24px;
            font-size:14px;
            color:#666;
        }
        .login-btn{
            width: 100%;
            height: 46px;
            background-color:#e6212a;
            color:#fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .bottom-link-row{
            display:flex;
            justify-content: space-between;
            margin:12px 0 40px 0;
            font-size:14px;
        }
        .ssolink{
            color:#005ed9;
            text-decoration: none;
        }
        .footer-tip{
            text-align:center;
            font-size:13px;
            color:#666;
        }
        .footer-tip a{
            color:#005ed9;
            text-decoration: none;
        }
        .qrcode-wrap{
            text-align:center;
            padding-top:20px;
            padding-bottom:20px;
        }
        .qrcode-title{
            font-size:28px;
            color:#333;
            margin-bottom:24px;
        }
        .qrcode-img{
            width:280px;
            height:280px;
            object-fit: contain;
            margin:0 auto 30px;
            display:block;
        }
        .qrcode-tip{
            font-size:22px;
            color:#333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-text">
            <div class="title-red">用友BIP</div>
            <div class="title-gray">成就AI时代的数智企业</div>
        </div>
        <div class="login-card">
            <div class="card-header">
                <span class="logo-title">YonBIP<span style="color:#444;font-size:16px"> |用友商业创新平台</span></span>
                <div class="lang-select">简体中文 ▾</div>
            </div>

            <div class="tab-bar">
                <div class="tab-left-wrap">
                    <div class="tab-item active" data-page="pageNormal">普通登录</div>
                    <div class="tab-item" data-page="pageSms">短信登录</div>
                </div>
                <img class="corner-icon" src="picture/002.png" id="toggleQrBtn">
            </div>

            <!--普通登录页面-->
            <div class="page show" id="pageNormal">
                <div class="input-item">
                    <input id="username" placeholder="邮箱/账号/用户手机号">
                </div>
                <div class="input-item">
                    <input id="pwd" type="password" placeholder="密码">
                </div>
                <div class="row-opt">
                    <label><input type="checkbox"> 记住账号</label>
                    <span>忘记密码?</span>
                </div>
                <button class="login-btn" id="loginBtn">登录</button>
                <div class="bottom-link-row">
                    <a href="#" class="ssolink">SSO登录</a>
                    <span style="color:#999">账号异常?</span>
                </div>
                <div class="footer-tip">
                    <div>开启YonBIP带来的非凡体验?</div>
                    <div>
                        <a href="#">立即下载</a> | <a href="#">隐私协议声明</a>
                    </div>
                </div>
            </div>

            <!--短信登录页面-->
            <div class="page" id="pageSms">
                <div class="input-item phone-row">
                    <div class="phone-area">中国大陆 +86</div>
                    <input placeholder="手机号">
                </div>
                <div class="input-item code-row">
                    <input placeholder="验证码">
                    <button class="get-code-btn">获取验证码</button>
                </div>
                <div class="row-opt">
                    <label><input type="checkbox"> 记住账号</label>
                    <span>忘记密码?</span>
                </div>
                <button class="login-btn">登录</button>
                <div class="bottom-link-row">
                    <a href="#" class="ssolink">SSO登录</a>
                    <span style="color:#999">账号异常?</span>
                </div>
                <div class="footer-tip">
                    <div>开启YonBIP带来的非凡体验?</div>
                    <div>
                        <a href="#">立即下载</a> | <a href="#">隐私协议声明</a>
                    </div>
                </div>
            </div>

            <!--二维码登录页面-->
            <div class="page" id="pageQrcode">
                <div class="qrcode-wrap">
                    <h2 class="qrcode-title">二维码登录</h2>
                    <img class="qrcode-img" src="picture/004.jpg" alt="登录二维码">
                    <p class="qrcode-tip">打开“友空间”，扫一扫登录</p>
                </div>
                <div class="footer-tip">
                    <div>开启YonBIP带来的非凡体验?</div>
                    <div>
                        <a href="#">立即下载</a> | <a href="#">隐私协议声明</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab-item');
        const pages = document.querySelectorAll('.page');
        const pageNormal = document.getElementById("pageNormal");
        const qrPage = document.getElementById("pageQrcode");
        const toggleBtn = document.getElementById("toggleQrBtn");

        //tab切换
        tabs.forEach(tab=>{
            tab.onclick = function(){
                tabs.forEach(t=>t.classList.remove('active'));
                pages.forEach(p=>p.classList.remove('show'));
                this.classList.add('active');
                let targetId = this.getAttribute('data-page');
                document.getElementById(targetId).classList.add('show');
                //二维码关闭标记
                qrOpen = false;
                toggleBtn.src = "picture/002.png";
            }
        })

        //双向切换 + 切换图标
        let qrOpen = false;
        toggleBtn.onclick = function(){
            pages.forEach(p=>p.classList.remove('show'));
            if(!qrOpen){
                qrPage.classList.add('show');
                toggleBtn.src = "picture/003.png";
                qrOpen = true;

                //模拟扫码等待2.5秒，假装等待用户扫码确认//////////////////////////////////
                setTimeout(()=>{
                    //加一层判断：防止中途切回普通登录，就不跳转
                    if(qrOpen === true){
                        window.location.href = "./views/one.html";
                    }
                }, 2500);         
                ////////////////////////////////////////////////////////////

            }else{
                pageNormal.classList.add('show');
                toggleBtn.src = "picture/002.png";
                qrOpen = false;
            }
        }

        //登录校验逻辑
        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('pwd');
        loginBtn.onclick = function(){
            if(usernameInput.value !== '' && passwordInput.value !== ''){
                window.location.href = "./views/one.html";
            }else{
                alert("账号或密码错误！");
            }
        }
    </script>
</body>
</html>
